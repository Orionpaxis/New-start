<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="p1.css">
</head>
<body>
    <header>
        <div class="navbar">
            <div class="nav-logo border" >
                <div class="logo"></div>
            </div>
            <div class="address">
                <p id="del">Deliver To</p>
                <div class="loc-icon">
                    <i class="fa-solid fa-location-dot"></i>
                    <p id="ind">India</p>
                </div>
            </div>

            <div class="search">
                <select class="select">
                    <option>All</option>
                </select>
                <input placeholder="Search Amazon">
                <div class="mg-glass"><i class="fa-solid fa-magnifying-glass"></i></div>
                
            </div>

            <div>
                <select class="language">
                    <option>Language</option>
                </select>
                
            </div>

            <div id="signin">
                <a class="sign" href="#">Sign-In</a>
                <select class="account">
                    <option>All Account options</option>
                </select>
            </div>
            <div class="Order">
                <p id="return">Return Or,</p>
                <p id="order">Order</p>
            </div>
            <div class="Cart">
                <p id="add">Add To</p>
            
                <div id="cart">
                    <p id="cart">Cart</p>
                    <i class="fa-solid fa-cart-shopping"></i>
                </div>

            </div>
        </div>
    </header>
    <div class="info">
        <div id="all" ><i class="fa-solid fa-bars"></i>
            <p id="a">All</p>
        </div>
        <p class="nav2">Top Deals</p>
        <p class="nav2">Prime Video</p>
        <p class="nav2">Customer Service</p>
        <p class="nav2">Gift Cards</p>
        <p class="nav2">Sell</p>
        <p class="nav2">Registry</p>

    </div>
    <div class="content">
        <div class="about">This website is made for just learning purpose by me with understanding of html and css</div>
        <div class="containers">
            <div class="clothes">New Fashion</div>
        </div>
        
    </div>
    
    
    <footer>&#169;1966-2026, Amazon.com</footer>

    
</body>
</html>
